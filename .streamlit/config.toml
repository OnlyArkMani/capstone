# Streamlit native theme.
#
# This sets the colours Streamlit paints its own widgets with — inputs, buttons,
# selectboxes, the sidebar, the dataframe grid. dashboard/style.py layers the
# project's visual language on top; without this file that layer would sit on a
# white page and every widget would fight it.
#
# The palette is documented in dashboard/style.py. Keep the two in step.

[theme]
base                    = "dark"
primaryColor            = "#5B8DEF"
backgroundColor         = "#101116"
secondaryBackgroundColor = "#191B21"
textColor               = "#E1E6EF"
font                    = "sans serif"

[client]
toolbarMode = "minimal"
